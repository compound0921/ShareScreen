<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareScreen</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <h1>ShareScreen</h1>
  <span id="badge" class="badge badge-idle">已停止</span>
</header>

<main class="grid">

  <!-- ─────────── 左栏:设置 ─────────── -->
  <section class="card">
    <h2>采集设置</h2>

    <div class="field">
      <label for="source">采集源</label>
      <select id="source">
        <option value="screen_ddagrab">屏幕(推荐,GPU 采集)</option>
        <option value="screen_gdigrab">屏幕(兼容模式)</option>
        <option value="window">单个窗口</option>
        <option value="obs">OBS 虚拟摄像头(只有画面)</option>
        <option value="obs_push">OBS 直推(含音频)</option>
      </select>
      <p class="hint" id="sourceHint"></p>
    </div>

    <div class="field" id="pushField" hidden>
      <label>在 OBS 里填这个地址</label>
      <div id="pushList"></div>
      <p class="hint">
        OBS → 设置 → 直播 → 服务选 <strong>WHIP</strong>,粘上面的地址。
      </p>
    </div>

    <div class="field" id="windowField" hidden>
      <label for="windowSelect">选择窗口</label>
      <div class="inline-row">
        <select id="windowSelect"></select>
        <button id="refreshWindows" type="button">刷新</button>
      </div>

      <label for="windowTitle" class="gap-top">或手动填写标题</label>
      <input type="text" id="windowTitle" placeholder="窗口标题中包含的文字">
      <p class="hint">
        按<strong>标题中包含的文字</strong>匹配,不必完全一致。标题变了就重新选。
      </p>
    </div>

    <!-- OBS 直推模式下由 OBS 决定,整组隐藏 -->
    <div id="captureParams">
      <div class="field">
        <label for="resolution">分辨率</label>
        <select id="resolution"></select>
        <p class="hint">不缩放时 CPU 最低、画面最清晰。</p>
      </div>

      <div class="row">
        <div class="field">
          <label for="fps">帧率</label>
          <select id="fps">
            <option value="60">60 fps</option>
            <option value="30">30 fps</option>
            <option value="20">20 fps</option>
            <option value="15">15 fps</option>
          </select>
        </div>

        <div class="field">
          <label for="encoder">编码器</label>
          <select id="encoder"></select>
        </div>
      </div>
    </div>

    <div class="field" id="audioField">
      <label class="check">
        <input type="checkbox" id="audioEnabled">
        <span>共享桌面音频</span>
      </label>
      <select id="audioBitrate" class="gap-top">
        <option value="64">64 kbps</option>
        <option value="96">96 kbps</option>
        <option value="128">128 kbps</option>
        <option value="192">192 kbps</option>
      </select>
      <p class="hint">换耳机、切 HDMI 都会自动跟随。</p>
    </div>

    <div class="row">
      <div class="field">
        <label for="bitrate">码率</label>
        <select id="bitrate">
          <option value="1000">1 Mbps</option>
          <option value="1500">1.5 Mbps</option>
          <option value="2000">2 Mbps</option>
          <option value="3000">3 Mbps</option>
          <option value="4000">4 Mbps</option>
          <option value="6000">6 Mbps</option>
          <option value="8000">8 Mbps</option>
          <option value="12000">12 Mbps</option>
        </select>
      </div>

      <div class="field">
        <label for="uplink">上行带宽</label>
        <div class="input-suffix">
          <input type="number" id="uplink" min="1" max="1000" step="0.1">
          <span>Mbps</span>
        </div>
      </div>
    </div>
    <p class="hint" id="bitrateHint">填实测上传速率,只用于估算观众数。</p>

    <div class="field">
      <label for="publicHost">公网地址(可选)</label>
      <input type="text" id="publicHost" placeholder="例如 example.com:8443">
      <p class="hint">
        格式「IP 或域名[:端口]」。<strong>不填则公网观众看不到画面。</strong>
      </p>
    </div>
  </section>

  <!-- ─────────── 右栏:状态 ─────────── -->
  <section class="card">
    <h2>推流状态</h2>

    <div class="actions">
      <button id="toggle" class="primary">开始共享</button>
      <button id="restart" class="ghost">重启</button>
      <span class="muted" id="uptime"></span>
    </div>

    <div class="field">
      <div class="stat-row">
        <span>当前观众</span>
        <strong id="viewers">—</strong>
      </div>
      <div class="capacity">
        <div class="capacity-bar"><div id="capacityFill"></div></div>
        <span id="capacityText" class="muted"></span>
      </div>
    </div>

    <div class="field" id="watchField">
      <label>观看地址</label>
      <div id="watchList"></div>
      <div class="qr-wrap">
        <img id="qr" alt="观看地址二维码" hidden>
      </div>
    </div>

    <p class="hint">
      <strong>不做鉴权</strong>,链接即凭据,别发到公开场合。<br>
      末尾的 <code>?muted=0</code> 不能丢,丢了没声音。
    </p>

    <div class="field warn-box" id="warnBox" hidden>
      <label>提示</label>
      <pre id="warnText"></pre>
    </div>

    <div class="field error-box" id="errorBox" hidden>
      <label>出错了</label>
      <pre id="errorText"></pre>
    </div>

    <details class="field" id="cmdBox">
      <summary>实际执行的命令</summary>
      <pre id="cmdText"></pre>
    </details>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
